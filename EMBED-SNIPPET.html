<!-- Elite Electric Calculator: paste into a WordPress Custom HTML block -->
<div id="elite-electric-calculator-wrap" style="width:100%;overflow:hidden;">
  <iframe
    id="elite-electric-calculator"
    src="https://YOUR-CALCULATOR.vercel.app/"
    title="Elite Electric Utah Solar & Battery Calculator"
    style="width:100%;height:700px;border:0;display:block;"
    loading="lazy"
    scrolling="no">
  </iframe>
</div>
<script>
(function(){
  var frame=document.getElementById('elite-electric-calculator');
  if(!frame)return;
  window.addEventListener('message',function(e){
    if(!e.data || e.data.type!=='elite-electric-calculator-height')return;
    var h=parseInt(e.data.height,10);
    if(h && h>400 && h<12000) frame.style.height=(h+8)+'px';
  });
})();
</script>
