<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/favicon.png"><title>Elite Electric | Lead Portal</title>
<style>
:root{--gold:#d6ad55;--black:#101010;--bg:#f5f5f2;--muted:#666}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#171717}button,input{font:inherit}.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#111;color:#fff;padding:16px 20px;border-radius:14px}.top img{height:42px;width:auto}.top-right{display:flex;align-items:center;gap:12px}.top button{border:1px solid #444;background:#222;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.login{max-width:430px;margin:12vh auto;background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;box-shadow:0 12px 35px #0000000c}.login h1{margin:0 0 8px;font-size:25px}.login p{color:var(--muted);font-size:13px;line-height:1.5}.field{display:block;margin:14px 0}.field b{display:block;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px}.primary{width:100%;background:#111;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}.err{color:#a32a2a;font-size:12px;margin-top:10px}.dashboard{display:none}.toolbar{margin:18px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{background:#fff;border:1px solid #ccc;border-radius:10px;padding:10px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.stat span{display:block;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.stat strong{font-size:25px;display:block;margin-top:7px}.table-wrap{margin-top:15px;background:#fff;border:1px solid #ddd;border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;font-size:12px}.table th{background:#fafaf7;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#666}.name{font-weight:800}.sub{display:block;color:#777;margin-top:3px}.view{border:1px solid #ccc;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.details{display:none;background:#fafaf7;padding:14px;border-top:1px solid #eee}.details pre{white-space:pre-wrap;word-break:break-word;font:11px/1.5 Consolas,monospace;margin:0}.empty{padding:30px;text-align:center;color:#777}.small{font-size:11px;color:#777;margin-top:8px}@media(max-width:700px){.wrap{padding:14px}.top{padding:12px}.top img{height:34px}.stats{grid-template-columns:1fr}.login{margin:8vh 14px}}
</style>
</head>
<body>
<div id="login" class="login">
  <img src="assets/elite-electric-logo-transparent.png" style="width:180px;max-width:100%;background:#111;border-radius:8px;padding:8px" alt="Elite Electric">
  <h1>Lead Portal</h1><p>Private Elite Electric calculator leads. Leads older than 60 days are automatically removed when the portal is refreshed.</p>
  <form id="loginForm"><label class="field"><b>Username</b><input id="username" autocomplete="username" required></label><label class="field"><b>Password</b><input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button><div id="loginError" class="err"></div></form>
</div>
<div id="dashboard" class="dashboard"><div class="wrap">
  <div class="top"><img src="assets/elite-electric-logo-transparent.png" alt="Elite Electric"><div class="top-right"><span id="lastUpdated" class="small" style="color:#bbb"></span><button id="logout">Log out</button></div></div>
  <div class="toolbar"><input id="search" placeholder="Search name, email, phone or ZIP…"><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Name A–Z</option></select><button id="refresh" class="view">Refresh</button></div>
  <div class="stats"><div class="stat"><span>Total active leads</span><strong id="count">0</strong></div><div class="stat"><span>Last 7 days</span><strong id="week">0</strong></div><div class="stat"><span>Saved calculator estimates</span><strong id="saved">0</strong></div></div>
  <div class="table-wrap"><table class="table"><thead><tr><th>Lead</th><th>Date</th><th>ZIP</th><th>Estimate</th><th>Battery</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" style="display:none">No leads match your search.</div></div>
</div></div>
<script>
let leads=[];
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(path,opt){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function load(){try{const d=await api('/api/leads');leads=d.leads||[];render();$('#lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();$('#login').style.display='none';$('#dashboard').style.display='block';}catch(e){if(e.message==='Unauthorized'){$('#login').style.display='block';$('#dashboard').style.display='none';}else alert(e.message)}}
function render(){const q=$('#search').value.trim().toLowerCase();let a=leads.filter(x=>[x.name,x.email,x.phone,x.zip].join(' ').toLowerCase().includes(q));const sort=$('#sort').value;if(sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name));else a.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at)*(sort==='oldest'?-1:1));if(sort==='oldest')a.sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));$('#count').textContent=leads.length;$('#week').textContent=leads.filter(x=>Date.now()-new Date(x.created_at)<7*86400000).length;$('#saved').textContent=leads.filter(x=>x.data?.estimate).length;$('#rows').innerHTML=a.map((x,i)=>{const e=x.data?.estimate||{};return `<tr><td><span class="name">${esc(x.name)}</span><span class="sub">${esc(x.email)}</span><span class="sub">${esc(x.phone)}</span></td><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.zip)}</td><td>${e.kw?esc(e.kw.toFixed(1)+' kW · '+Math.round(e.offset)+'%'): '—'}</td><td>${e.battery?esc(e.battery+' kWh'):'—'}</td><td><button class="view" data-i="${i}" data-key="${esc(x.lead_key)}">View details</button></td></tr><tr class="detail-row" id="d-${esc(x.lead_key)}"><td colspan="6"><div class="details"><pre>${esc(JSON.stringify(x,null,2))}</pre></div></td></tr>`}).join('');$('#empty').style.display=a.length?'none':'block';document.querySelectorAll('.view[data-key]').forEach(b=>b.onclick=()=>{const d=document.querySelector('#d-'+CSS.escape(b.dataset.key)+' .details');if(d)d.style.display=d.style.display==='block'?'none':'block'});}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});await load()}catch(e){$('#loginError').textContent=e.message}};
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};$('#refresh').onclick=load;$('#search').oninput=render;$('#sort').onchange=render;
load();
</script>
</body></html>
