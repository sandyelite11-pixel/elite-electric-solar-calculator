<!-- Add this small script to the WordPress /lead/ page if you want its height to be reported to the calculator. -->
<script>
(function(){function send(){var h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);if(window.parent&&window.parent!==window)window.parent.postMessage({type:'elite-lead-form-height',height:h},'*');}window.addEventListener('load',send);window.addEventListener('resize',send);if('ResizeObserver'in window)new ResizeObserver(send).observe(document.body);setTimeout(send,500);setTimeout(send,1500);})();
</script>
